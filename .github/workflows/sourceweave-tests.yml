name: Sourceweave tests

on:
  push:
    paths:
      - "projects/sourceweave/**"
      - ".github/workflows/sourceweave-tests.yml"
  pull_request:
    paths:
      - "projects/sourceweave/**"
      - ".github/workflows/sourceweave-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sourceweave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python sourceweave.py check examples/demo.json
